<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقف في صفي - أونلاين</title>
    <!-- مكتبة الربط الأونلاين -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; }
        
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 10px; text-align: center; }

        /* شريط كود الغرفة الثابت */
        .room-bar {
            background: #0284c7; color: #fff; padding: 8px 15px; border-radius: 20px;
            font-weight: bold; font-size: 14px; margin-bottom: 10px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; max-width: 500px;
        }

        .online-box {
            background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px;
            width: 100%; max-width: 500px; text-align: center; margin-bottom: 10px;
        }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; text-align: center; font-size: 15px; }
        button { width: 100%; padding: 11px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button.green { background: #10b981; }

        .categories { display: flex; gap: 5px; overflow-x: auto; width: 100%; max-width: 500px; margin-bottom: 10px; padding-bottom: 5px; }
        .cat-btn { background: #334155; color: #38bdf8; border: none; padding: 6px 12px; border-radius: 15px; font-size: 12px; white-space: nowrap; }
        .cat-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 500px; }
        .card { background: #1e293b; border: 2px solid #334155; border-radius: 8px; padding: 8px 2px; text-align: center; cursor: pointer; }
        .card .icon { font-size: 24px; }
        .card span { font-size: 10px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card.my-choice { border-color: #f59e0b; background: #78350f; }
        .card.eliminated { opacity: 0.2; filter: grayscale(100%); background: #450a0a; border-color: #ef4444; }

        .chat-box { background: #1e293b; width: 100%; max-width: 500px; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid #334155; }
        .messages { max-height: 120px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; text-align: right; background: #0f172a; padding: 8px; border-radius: 6px; }
        .msg { padding: 4px; border-bottom: 1px solid #1e293b; }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { margin: 0; }
        .chat-input button { width: auto; padding: 0 15px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🎮 اقف في صفي (أونلاين)</h1>
    <div class="subtitle" id="status">أنشئ غرفة أو أدخل كود صاحبك!</div>

    <!-- شريط الكود الثابت بعد الدخول -->
    <div id="roomBar" class="room-bar hidden">🔑 كود الغرفة: <span id="activeRoomCode">---</span></div>

    <div id="setup-box" class="online-box">
        <button onclick="createRoom()" class="green">🌐 إنشاء كود غرفة جديد</button>
        <hr style="border-color:#334155; margin:15px 0;">
        <input type="text" id="joinCodeInput" placeholder="أدخل كود غرفة صاحبك هنا...">
        <button onclick="joinRoom()">انضمام لغرفة صاحبك 🚀</button>
    </div>

    <div id="game-ui" class="hidden" style="width:100%; max-width:500px;">
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('players')">⚽ لاعيبة</button>
            <button class="cat-btn" onclick="setCategory('actors')">🎬 مشاهير</button>
            <button class="cat-btn" onclick="setCategory('movies')">🍿 أفلام</button>
            <button class="cat-btn" onclick="setCategory('food')">🍔 أكل</button>
            <button class="cat-btn" onclick="setCategory('animals')">🦁 حيوانات</button>
        </div>

        <div id="grid" class="grid"></div>

        <div class="chat-box">
            <div id="messages" class="messages"><b>سجل الأسئلة والإجابات:</b></div>
            <div class="chat-input">
                <input type="text" id="questionInput" placeholder="اسأل صاحبك أي سؤال...">
                <button onclick="sendQuestion()">إرسال</button>
            </div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <button onclick="sendAnswer('نعم! ✅')" style="background:#10b981; font-size:11px;">رد بـ (نعم)</button>
                <button onclick="sendAnswer('لا! ❌')" style="background:#ef4444; font-size:11px;">رد بـ (لا)</button>
            </div>
        </div>
    </div>

    <script>
        let client = null;
        let currentRoom = "";
        let myClientId = "user_" + Math.random().toString(36).substring(7);
        let mySecretPlayer = null;
        let currentCategory = 'players';

        const DATABASE = {
            players: [
                { name: "محمد صلاح", icon: "🇪🇬" }, { name: "أبو تريكة", icon: "👑" }, { name: "ميسي", icon: "🇦🇷" }, { name: "رونالدو", icon: "🇵🇹" },
                { name: "زيدان", icon: "🇫🇷" }, { name: "مرموش", icon: "🦅" }, { name: "بنزيما", icon: "🇫🇷" }, { name: "الشناوي", icon: "🧤" },
                { name: "مودريتش", icon: "🇭🇷" }, { name: "رونالدينيو", icon: "🤙" }, { name: "إمبابي", icon: "⚡" }, { name: "هالاند", icon: "🤖" },
                { name: "نيمار", icon: "🇧🇷" }, { name: "بوفون", icon: "🧱" }, { name: "ميدو", icon: "🎙️" }, { name: "مالديني", icon: "🛡️" }
            ],
            actors: [
                { name: "عادل إمام", icon: "🕶️" }, { name: "أحمد حلمي", icon: "👓" }, { name: "توم كروز", icon: "🎬" }, { name: "ويل سميث", icon: "🎭" },
                { name: "كريم عبد العزيز", icon: "🌟" }, { name: "أحمد السقا", icon: "🐎" }, { name: "دي كابريو", icon: "🏆" }, { name: "هنيدي", icon: "😄" }
            ],
            movies: [
                { name: "الجزيرة", icon: "🏝️" }, { name: "إبراهيم الأبيض", icon: "🔪" }, { name: "Avatar", icon: "🌌" }, { name: "Titanic", icon: "🚢" },
                { name: "الفيل الأزرق", icon: "🐘" }, { name: "Inception", icon: "🌀" }, { name: "ولاد رزق", icon: "🔥" }, { name: "Interstellar", icon: "🚀" }
            ],
            food: [
                { name: "كشري", icon: "🍲" }, { name: "بيتزا", icon: "🍕" }, { name: "أم علي", icon: "🍨" }, { name: "برجر", icon: "🍔" },
                { name: "ملوخية", icon: "🌿" }, { name: "شاورما", icon: "🥙" }, { name: "فطير", icon: "🥮" }, { name: "آيس كريم", icon: "🍦" }
            ],
            animals: [
                { name: "أسد", icon: "🦁" }, { name: "صقر", icon: "🦅" }, { name: "أرنب", icon: "🐇" }, { name: "قرش", icon: "🦈" },
                { name: "زرافة", icon: "🦒" }, { name: "نمر", icon: "🐅" }, { name: "بطريق", icon: "🐧" }, { name: "دب", icon: "🐻" }
            ]
        };

        function connectMQTT(roomCode) {
            document.getElementById('status').innerText = "جاري الاتصال بالسيرفر الأونلاين...";
            
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            client.on('connect', () => {
                currentRoom = "abdo_game_room_" + roomCode;
                client.subscribe(currentRoom);

                // إظهار الكود فوق والشاشة الرئسية للعبة
                document.getElementById('activeRoomCode').innerText = roomCode;
                document.getElementById('roomBar').classList.remove('hidden');
                document.getElementById('setup-box').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                document.getElementById('status').innerText = "تم الاتصال! اختر شخصيتك السرية بالضغط عليها.";
                
                renderBoard();

                sendMessage({ type: 'join', sender: myClientId });
            });

            client.on('message', (topic, message) => {
                const data = JSON.parse(message.toString());
                if (data.sender === myClientId) return;

                if (data.type === 'chat') {
                    addMessage("صاحبك", data.text);
                } else if (data.type === 'guess') {
                    if (data.name === mySecretPlayer) {
                        alert("🎉 صاحبك خمن صح وفاز عليك!");
                        sendMessage({ type: 'chat', text: '🎉 مبروك! إجابتك صح وتوقعت صح!' });
                    } else {
                        addMessage("النظام", `صاحبك خمن (${data.name}) وكانت إجابة خاطئة ❌`);
                    }
                } else if (data.type === 'join') {
                    addMessage("النظام", "انضم صاحبك للغرفة الآن! ابدأوا اللعب 🚀");
                }
            });
        }

        function createRoom() {
            const code = "ABDO-" + Math.floor(1000 + Math.random() * 9000);
            connectMQTT(code);
        }

        function joinRoom() {
            const code = document.getElementById('joinCodeInput').value.trim();
            if(!code) return alert("أدخل كود الغرفة أولاً!");
            connectMQTT(code);
        }

        function sendMessage(obj) {
            if (client && currentRoom) {
                obj.sender = myClientId;
                client.publish(currentRoom, JSON.stringify(obj));
            }
        }

        function renderBoard() {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const items = DATABASE[currentCategory];

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;
                card.innerHTML = `<div class="icon">${item.icon}</div><span>${item.name}</span>`;
                card.onclick = () => handleCardClick(index, item.name);
                grid.appendChild(card);
            });
        }

        function handleCardClick(index, name) {
            const card = document.getElementById(`card-${index}`);
            if (!mySecretPlayer) {
                mySecretPlayer = name;
                card.classList.add('my-choice');
                document.getElementById('status').innerText = `اختيارك السرّي: (${name}). اسأل صاحبك أو شطب كروت!`;
            } else {
                if (confirm(`هل تريد شطب (${name}) من شبكتك؟`)) {
                    card.classList.add('eliminated');
                } else if (confirm(`هل تريد تخمين أن كارت صاحبك هو (${name})؟`)) {
                    sendMessage({ type: 'guess', name: name });
                    addMessage("أنت", `خمنت أن كارت صاحبك هو: ${name}`);
                }
            }
        }

        function sendQuestion() {
            const q = document.getElementById('questionInput').value.trim();
            if(!q) return;
            addMessage("أنت", q);
            sendMessage({ type: 'chat', text: q });
            document.getElementById('questionInput').value = "";
        }

        function sendAnswer(ans) {
            addMessage("إجابتك", ans);
            sendMessage({ type: 'chat', text: "الإجابة: " + ans });
        }

        function addMessage(sender, text) {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<div class="msg"><b>${sender}:</b> ${text}</div>`;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }

        function setCategory(cat) {
            currentCategory = cat;
            mySecretPlayer = null;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderBoard();
        }
    </script>
</body>
</html>
