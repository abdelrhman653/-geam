<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقف في صفي - أونلاين</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent-blue: #00b4d8;
            --accent-red: #e63946;
            --accent-green: #2a9d8f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #14213d;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 { font-size: 1.2rem; color: #fff; }

        .room-code {
            background: var(--accent-blue);
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }

        .active { display: flex; }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: 0.2s;
        }

        .btn-danger { background: var(--accent-red); }
        .btn-green { background: var(--accent-green); }
        .btn:active { transform: scale(0.98); }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            aspect-ratio: 3/4;
            border: 2px solid #334155;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 75%;
            object-fit: cover;
            border-radius: 6px;
        }

        .card span {
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            margin-top: 4px;
        }

        .card.eliminated {
            filter: grayscale(100%);
            opacity: 0.3;
        }

        .card.eliminated::after {
            content: "✕";
            position: absolute;
            color: var(--accent-red);
            font-size: 3rem;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .my-choice {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid var(--accent-blue);
        }

        .status-msg {
            margin: 10px 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <h1>اقف في صفي - أونلاين</h1>
        <div id="roomDisplay" class="room-code" style="display:none;">كود الغرفة: <span id="codeText"></span></div>
    </header>

    <!-- شاشة البداية -->
    <div id="startScreen" class="screen active">
        <input type="text" id="username" placeholder="اكتب اسمك هنا">
        <button class="btn btn-green" onclick="createRoom()">إنشاء غرفة جديدة</button>
        <hr style="width:100%; border:1px solid #334155; margin:15px 0;">
        <input type="text" id="joinCode" placeholder="أدخل كود الغرفة للإنضمام">
        <button class="btn" onclick="joinRoom()">دخول الغرفة</button>
    </div>

    <!-- شاشة اختيار القسم -->
    <div id="categoryScreen" class="screen">
        <h3>اختر القسم للعب:</h3>
        <button class="btn" onclick="selectCategory('players')">لاعبين كرة قدم ⚽</button>
        <button class="btn" onclick="selectCategory('actors')">ممثلين 🎬</button>
        <button class="btn" onclick="selectCategory('movies')">أفلام 🎥</button>
        <button class="btn" onclick="selectCategory('food')">أكلات 🍔</button>
    </div>

    <!-- شاشة الانتظار -->
    <div id="waitScreen" class="screen">
        <h3 class="status-msg">في انتظار الخصم للانضمام والاختيار...</h3>
    </div>

    <!-- شاشة اللعب -->
    <div id="gameScreen" class="screen">
        <div class="my-choice">
            شخصيتك السرية: <b id="myTargetName" style="color:var(--accent-blue);">...</b>
        </div>
        <div class="grid" id="grid"></div>
        <button class="btn btn-danger" onclick="leaveGame()">خروج</button>
    </div>

    <script>
        const DATABASE = {
            players: [
                { name: "محمد صلاح", img: "images/Salah.jpg" },
                { name: "أبو تريكة", img: "images/Abu Trika.jpeg" },
                { name: "ليونيل ميسي", img: "images/Messi.jpeg" },
                { name: "كريستيانو رونالدو", img: "images/Ronaldo.webp" },
                { name: "عمر مرموش", img: "images/Marmoush.webp" },
                { name: "محمد الشناوي", img: "images/Shenawi.webp" },
                { name: "كيليان إمبابي", img: "images/Mbappe.webp" },
                { name: "إرلينج هالاند", img: "images/Haaland.webp" },
                { name: "زين الدين زيدان", img: "images/Zidane.webp" },
                { name: "لوكا مودريتش", img: "images/Modric.webp" },
                { name: "كريم بنزيما", img: "images/Benzema.webp" },
                { name: "نيمار داسيلفا", img: "images/Neymar.webp" },
                { name: "مصطفى محمد", img: "images/Mustafa.webp" },
                { name: "رونالدينيو", img: "images/Ronaldinho.webp" },
                { name: "شيكابالا", img: "images/Chica.webp" }
            ],
            actors: [
                { name: "عادل إمام", img: "images/Adel.jpg" },
                { name: "أحمد حلمي", img: "images/Helmy.jpg" },
                { name: "كريم عبد العزيز", img: "images/Karim.jpg" },
                { name: "أحمد السقا", img: "images/Sakka.jpg" },
                { name: "محمد هنيدي", img: "images/Henedy.jpg" },
                { name: "توم كروز", img: "images/Tom.jpg" },
                { name: "ويل سميث", img: "images/Will.jpg" },
                { name: "ليوناردو دي كابريو", img: "images/Leo.jpg" },
                { name: "أمير كرارة", img: "images/Karara.jpg" },
                { name: "ماجد الكدواني", img: "images/Maged.jpg" },
                { name: "آسر ياسين", img: "images/Asser.jpg" },
                { name: "منى زكي", img: "images/Mona.jpg" },
                { name: "ياسمين عبد العزيز", img: "images/Yasmin.jpg" },
                { name: "جاكي شان", img: "images/Jackie.jpg" },
                { name: "ذا روك", img: "images/Rock.jpg" }
            ],
            movies: [
                { name: "الجزيرة", img: "images/Gezira.jpg" },
                { name: "الفيل الأزرق", img: "images/Elephant.jpg" },
                { name: "ولاد رزق", img: "images/Rizk.jpg" },
                { name: "Avatar", img: "images/Avatar.jpg" },
                { name: "Titanic", img: "images/Titanic.jpg" },
                { name: "كازابلانكا", img: "images/Casablanca.jpg" },
                { name: "كيرة والجن", img: "images/Kira.jpg" },
                { name: "Inception", img: "images/Inception.jpg" },
                { name: "Interstellar", img: "images/Interstellar.jpg" },
                { name: "Joker", img: "images/Joker.jpg" },
                { name: "The Dark Knight", img: "images/Batman.jpg" },
                { name: "Avengers", img: "images/Avengers.jpg" },
                { name: "إبراهيم الأبيض", img: "images/Ibrahim.jpg" },
                { name: "صعيدي في الجامعة", img: "images/Saedi.jpg" },
                { name: "عسل أسود", img: "images/Assal.jpg" }
            ],
            food: [
                { name: "كشري", img: "images/Koshary.jpg" },
                { name: "بيتزا", img: "images/Pizza.jpg" },
                { name: "برجر", img: "images/Burger.jpg" },
                { name: "ملوخية", img: "images/Molokhia.jpg" },
                { name: "شاورما", img: "images/Shawarma.jpg" },
                { name: "طعمة / فلافل", img: "images/Falafel.jpg" },
                { name: "فول مدمس", img: "images/Ful.jpg" },
                { name: "فتة مصرية", img: "images/Fatteh.jpg" },
                { name: "حواوشي", img: "images/Hawawshi.jpg" },
                { name: "سوشي", img: "images/Sushi.jpg" },
                { name: "كبسة", img: "images/Kabsa.jpg" },
                { name: "أم علي", img: "images/OmAli.jpg" },
                { name: "بشاميل", img: "images/Bechamel.jpg" },
                { name: "كباب وكفتة", img: "images/Kebab.jpg" },
                { name: "وافل", img: "images/Waffle.jpg" }
            ]
        };

        let peer = null;
        let conn = null;
        let myTarget = null;
        let currentCategory = 'players';

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function createRoom() {
            const randomCode = "ABDO-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(randomCode);

            peer.on('open', (id) => {
                document.getElementById('codeText').innerText = id;
                document.getElementById('roomDisplay').style.display = 'block';
                showScreen('categoryScreen');
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        function joinRoom() {
            const code = document.getElementById('joinCode').value.trim();
            if (!code) return alert("من فضلك أدخل كود الغرفة");

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
                showScreen('waitScreen');
            });
        }

        function selectCategory(cat) {
            currentCategory = cat;
            if (conn && conn.open) {
                conn.send({ type: 'start', category: cat });
                startGame(cat);
            } else {
                showScreen('waitScreen');
            }
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'start') {
                    startGame(data.category);
                }
            });
        }

        function startGame(cat) {
            const list = DATABASE[cat];
            myTarget = list[Math.floor(Math.random() * list.length)];
            document.getElementById('myTargetName').innerText = myTarget.name;

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            list.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.img}" alt="${item.name}"><span>${item.name}</span>`;
                card.onclick = () => card.classList.toggle('eliminated');
                grid.appendChild(card);
            });

            showScreen('gameScreen');
        }

        function leaveGame() {
            location.reload();
        }
    </script>
</body>
</html>
