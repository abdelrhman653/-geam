<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة مين في صفي - النسخة المتطورة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: #38bdf8;
            font-size: 26px;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        .net-status {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 5px;
            display: inline-block;
            font-weight: bold;
        }
        .online { background: #065f46; color: #34d399; }
        .offline { background: #7f1d1d; color: #fca5a5; }

        /* شاشة البداية والغرف */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .modal-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-secondary { background: #475569; color: white; }

        /* التحكم والفئات */
        .category-select {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 12px;
            max-width: 700px;
        }

        .cat-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
        }

        .status-bar {
            background: #1e293b;
            width: 100%;
            max-width: 700px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            color: #f59e0b;
            margin-bottom: 15px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* شبكة الكروت الكبيرة */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card:hover {
            border-color: #38bdf8;
            transform: translateY(-3px);
        }

        .card .icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .card span {
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .card.eliminated {
            background: #450a0a;
            border-color: #ef4444;
            opacity: 0.3;
            filter: grayscale(100%);
        }

        .card.correct {
            background: #065f46;
            border-color: #34d399;
            animation: bounce 0.5s;
        }

        /* الأسئلة */
        .questions-section {
            background: #1e293b;
            width: 100%;
            max-width: 700px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }

        .questions-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .questions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .q-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .q-btn:hover { background: #2563eb; }
        .q-btn:disabled { background: #0f172a; color: #64748b; cursor: not-allowed; }

        .hidden { display: none !important; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPLSt21cRCgUsL3QA2TakbI0af07zQKsM",
            authDomain: "whoisitgame.firebaseapp.com",
            databaseURL: "https://whoisitgame-default-rtdb.firebaseio.com",
            projectId: "whoisitgame",
            storageBucket: "whoisitgame.firebasestorage.app",
            messagingSenderId: "347423883446",
            appId: "1:347423883446:web:9c435668649ec0e8d76617"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch(e) {}

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
        window.update = update;
    </script>
</head>
<body>

    <!-- نافذة البداية واختيار اللعب أونلاين أو ضد الكمبيوتر -->
    <div id="startModal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="color: #38bdf8; margin-bottom: 10px;">🎮 اقف في صفي المتطورة</h2>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">اختر طريقة اللعب المناسبة لك</p>
            
            <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." maxlength="15">
            
            <button class="btn btn-success" onclick="startVsBot()">🤖 اللعب ضد الكمبيوتر (أوفلاين)</button>
            <hr style="border-color: #334155; margin: 15px 0;">
            <button class="btn btn-primary" onclick="createRoomCode()">🌐 إنشاء غرفة أونلاين</button>
            <input type="text" id="roomCodeInput" placeholder="أدخل كود الغرفة للانضمام..." style="margin-top: 10px;">
            <button class="btn btn-secondary" onclick="joinRoomCode()">انضمام للغرفة 🚀</button>
        </div>

    <div class="header-box">

    <!-- الفئات -->

    <!-- الأسئلة -->

    <script>
        // الأصوات التفاعلية (بدون ملفات خارجية)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'correct') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

            },

                ],

                ]

                items: [
                    { name: "أسد", icon: "🦁", attr: { predator: true, fly: false } },
                    { name: "صقر", icon: "🦅", attr: { predator: true, fly: true } },
                    { name: "أرنب", icon: "🐇", attr: { predator: false, fly: false } },
                    { name: "حمامة", icon: "🕊️", attr: { predator: false, fly: true } },
                    { name: "قرش", icon: "🦈", attr: { predator: true, fly: false } },
                    { name: "زرافة", icon: "🦒", attr: { predator: false, fly: false } },
                    { name: "نمر", icon: "🐅", attr: { predator: true, fly: false } },
                    { name: "بطريق", icon: "🐧", attr: { predator: false, fly: false } }
                ],
                questions: [
                    { label: "هل الحيوان مفترس؟", key: "predator" },

        let currentCategory = 'players';
        let secretItem = null;
        let gameOver = false;
        let playerName = "اللاعب";
        let roomId = "";
        let isOnline = false;

        function checkNet() {
            const netTag = document.getElementById('netStatus');
            if (navigator.onLine) {
                netTag.innerText = "متصل بالإنترنت 🟢";
                netTag.className = "net-status online";
            } else {
                netTag.innerText = "غير متصل 🔴 (وضع أوفلاين)";
                netTag.className = "net-status offline";
            }
        }
        window.addEventListener('online', checkNet);
        window.addEventListener('offline', checkNet);
        checkNet();

        function changeCategory(cat) {
            playSound('click');
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            initGame();
        }

        function startVsBot() {
            const nameInput = document.getElementById('playerName').value.trim();
            if(nameInput) playerName = nameInput;
            isOnline = false;
            document.getElementById('startModal').classList.add('hidden');
            initGame();
        }

        function createRoomCode() {
            if(!navigator.onLine) return alert("أنت غير متصل بالإنترنت!");
            const nameInput = document.getElementById('playerName').value.trim();
            if(!nameInput) return alert("اكتب اسمك أولاً!");
            playerName = nameInput;

            roomId = Math.floor(1000 + Math.random() * 9000).toString();
            isOnline = true;
            
            const items = DATABASE[currentCategory].items;
            secretItem = items[Math.floor(Math.random() * items.length)];

            window.set(window.ref(window.db, 'rooms/' + roomId), {
                category: currentCategory,
                secret: secretItem,
                host: playerName
            }).then(() => {
                document.getElementById('startModal').classList.add('hidden');
                document.getElementById('status').innerText = `تم إنشاء الغرفة! الكود: ${roomId} (شارك الكود مع صاحبك)`;
                initGameSession();
            });
        }

        function joinRoomCode() {
            if(!navigator.onLine) return alert("أنت غير متصل بالإنترنت!");
            const nameInput = document.getElementById('playerName').value.trim();
            const codeInput = document.getElementById('roomCodeInput').value.trim();
            if(!nameInput || !codeInput) return alert("اكتب اسمك وكود الغرفة!");
            playerName = nameInput;
            roomId = codeInput;
            isOnline = true;

            window.onValue(window.ref(window.db, 'rooms/' + roomId), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    currentCategory = data.category;
                    secretItem = data.secret;
                    document.getElementById('startModal').classList.add('hidden');
                    document.getElementById('status').innerText = `انضممت للغرفة بنجاح مع ${data.host}! ابدأ التخمين.`;
                    initGameSession();
                } else {
                    alert("كود الغرفة غير موجود!");
                }
            }, { onlyOnce: true });
        }

        function initGame() {
            const items = DATABASE[currentCategory].items;
            secretItem = items[Math.floor(Math.random() * items.length)];
            gameOver = false;
            document.getElementById('status').innerText = `${playerName}، تم اختيار عنصر سرّي! ابدأ بالسؤال أو التخمين.`;
            renderBoard();
        }

        function initGameSession() {
            gameOver = false;
            renderBoard();
        }

        function renderBoard() {
            const items = DATABASE[currentCategory].items;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;
                card.onclick = () => makeGuess(index);
                card.innerHTML = `
                    <div class="icon">${item.icon}</div>
                    <span>${item.name}</span>
                `;
                grid.appendChild(card);
            });

            const qList = document.getElementById('questions');
            qList.innerHTML = "";
            DATABASE[currentCategory].questions.forEach((q) => {
                const btn = document.createElement('button');
                btn.className = 'q-btn';
                btn.innerText = q.label;
                btn.onclick = (e) => askAttr(q.key, q.label, e.target);
                qList.appendChild(btn);
            });
        }

        function askAttr(key, labelText, btn) {
            if(gameOver) return;
            playSound('click');
            btn.disabled = true;

            const res = secretItem.attr[key];
            if(res) {
                document.getElementById('status').innerText = `💡 الإجابة: نعم! (${labelText}) ✅`;
            } else {
                document.getElementById('status').innerText = `❌ الإجابة: لا! (${labelText})`;
            }

            // استبعاد غير المتطابقين وتغيير لونهم للأحمر
            const items = DATABASE[currentCategory].items;
            items.forEach((item, index) => {
                if(item.attr[key] !== res) {
                    document.getElementById(`card-${index}`).classList.add('eliminated');
                }
            });
        }

        function makeGuess(index) {
            if(gameOver) return;
            playSound('click');

            const selected = DATABASE[currentCategory].items[index];
            const card = document.getElementById(`card-${index}`);

            if(selected.name === secretItem.name) {
                playSound('correct');
                card.classList.add('correct');
                document.getElementById('status').innerText = `🎉 كفو يا ${playerName}! إجابة صحيحة، العنصر هو (${secretItem.name})!`;
                gameOver = true;
            } else {
                playSound('wrong');
                card.classList.add('eliminated');
                document.getElementById('status').innerText = `❌ خطأ! ليس (${selected.name}). حاول مجدداً.`;
            }
        }
    </script>
</body>
</html>
