<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقف في صفي - أونلاين وأوفلاين</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; }
        
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 10px; text-align: center; }

        .room-bar {
            background: #0284c7; color: #fff; padding: 8px 15px; border-radius: 20px;
            font-weight: bold; font-size: 14px; margin-bottom: 10px; text-align: center;
            width: 100%; max-width: 500px;
        }

        .box {
            background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px;
            width: 100%; max-width: 500px; text-align: center; margin-bottom: 10px;
        }
        
        input { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; text-align: center; font-size: 15px; }
        
        button { width: 100%; padding: 11px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button.green { background: #10b981; }
        button.purple { background: #8b5cf6; }
        button.gray { background: #475569; }

        .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .cat-card { background: #0f172a; border: 2px solid #3b82f6; border-radius: 8px; padding: 12px; cursor: pointer; font-weight: bold; }
        .cat-card:hover { background: #1e3a8a; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 500px; }
        .card { background: #1e293b; border: 2px solid #334155; border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .card img { width: 100%; height: 85px; object-fit: cover; border-radius: 6px; margin-bottom: 4px; background: #0f172a; }
        .card span { font-size: 11px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
        .card.my-choice { border-color: #f59e0b; background: #78350f; }
        .card.eliminated { opacity: 0.15; filter: grayscale(100%); background: #450a0a; border-color: #ef4444; }

        .chat-box { background: #1e293b; width: 100%; max-width: 500px; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid #334155; }
        .messages { max-height: 120px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; text-align: right; background: #0f172a; padding: 8px; border-radius: 6px; }
        .msg { padding: 4px; border-bottom: 1px solid #1e293b; }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { margin: 0; }
        .chat-input button { width: auto; padding: 0 15px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🎮 اقف في صفي</h1>
    <div class="subtitle" id="status">اختر طريقة اللعب للبدء!</div>

    <div id="roomBar" class="room-bar hidden">🔑 كود الغرفة: <span id="activeRoomCode">---</span></div>

    <div id="mode-box" class="box">
        <button onclick="startOnlineSetup()" class="green">🌐 لعب أونلاين مع صديق</button>
        <button onclick="startOfflineCategorySelect()" class="purple" style="margin-top: 10px;">🤖 لعب أوفلاين ضد الكمبيوتر</button>
        <hr style="border-color:#334155; margin:15px 0;">
        <input type="text" id="joinCodeInput" placeholder="أدخل كود غرفة صاحبك هنا...">
        <button onclick="joinRoom()">انضمام لغرفة أونلاين 🚀</button>
    </div>

    <div id="category-box" class="box hidden">
        <h3 style="color:#38bdf8;">اختر الفئة للعبة (15 عنصر لكل فئة):</h3>
        <div class="cat-grid">
            <div class="cat-card" onclick="confirmCategory('players')">⚽ لاعيبة كرة (15)</div>
            <div class="cat-card" onclick="confirmCategory('actors')">🎬 مشاهير وفنانين (15)</div>
            <div class="cat-card" onclick="confirmCategory('movies')">🍿 أفلام وسينما (15)</div>
            <div class="cat-card" onclick="confirmCategory('food')">🍔 أكلات شائعة (15)</div>
        </div>
        <button onclick="location.reload()" class="gray" style="margin-top:15px;">رجوع للقائمة</button>
    </div>

    <div id="game-ui" class="hidden" style="width:100%; max-width:500px;">
        <div id="grid" class="grid"></div>

        <div class="chat-box">
            <div id="messages" class="messages"><b>سجل الأسئلة والإجابات:</b></div>
            <div class="chat-input">
                <input type="text" id="questionInput" placeholder="اسأل أي سؤال...">
                <button onclick="sendQuestion()">إرسال</button>
            </div>
            <div id="quick-answers" style="display:flex; gap:5px; margin-top:5px;">
                <button onclick="sendAnswer('نعم! ✅')" style="background:#10b981; font-size:11px;">رد بـ (نعم)</button>
                <button onclick="sendAnswer('لا! ❌')" style="background:#ef4444; font-size:11px;">رد بـ (لا)</button>
            </div>
        </div>
    </div>

        function startOnlineSetup() {
            isOffline = false;
            document.getElementById('mode-box').classList.add('hidden');
            document.getElementById('category-box').classList.remove('hidden');
        }

        function startOfflineCategorySelect() {
            isOffline = true;
            document.getElementById('mode-box').classList.add('hidden');
            document.getElementById('category-box').classList.remove('hidden');
        }

        function confirmCategory(cat) {
            selectedCategory = cat;
            document.getElementById('category-box').classList.add('hidden');
            
            if (isOffline) {
                document.getElementById('roomBar').classList.remove('hidden');
                document.getElementById('activeRoomCode').innerText = "أوفلاين (ضد الكمبيوتر)";
                document.getElementById('game-ui').classList.remove('hidden');
                document.getElementById('quick-answers').classList.add('hidden');
                
                const items = DATABASE[selectedCategory];
                botSecretPlayer = items[Math.floor(Math.random() * items.length)].name;

                document.getElementById('status').innerText = "اختر كارتك السرّي أولاً للبدء!";
                renderBoard();
            } else {
                const code = "ABDO-" + Math.floor(1000 + Math.random() * 9000);
                connectMQTT(code);
            }
        }

        function connectMQTT(roomCode) {
            document.getElementById('status').innerText = "جاري الاتصال بالسيرفر...";
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            client.on('connect', () => {
                currentRoom = "abdo_game_room_" + roomCode;
                client.subscribe(currentRoom);

                document.getElementById('activeRoomCode').innerText = roomCode;
                document.getElementById('roomBar').classList.remove('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                document.getElementById('status').innerText = "اختر كارتك السرّي أولاً بالضغط عليه!";
                
                renderBoard();
                sendMessage({ type: 'join', category: selectedCategory });
            });

            client.on('message', (topic, message) => {
                const data = JSON.parse(message.toString());
                if (data.sender === myClientId) return;

                if (data.type === 'chat') {
                    addMessage("صاحبك", data.text);
                } else if (data.type === 'guess') {
                    if (data.name === mySecretPlayer) {
                        alert("🎉 صاحبك خمن صح وفاز عليك!");
                        sendMessage({ type: 'chat', text: '🎉 مبروك! إجابتك صح وتوقعت كارتي السرّي!' });
                    } else {
                        addMessage("النظام", `صاحبك خمن (${data.name}) وكانت إجابة خاطئة ❌`);
                    }
                } else if (data.type === 'join') {
                    addMessage("النظام", "انضم صاحبك للغرفة! ابدأوا اللعب 🚀");
                }
            });
        }

        function joinRoom() {
            const code = document.getElementById('joinCodeInput').value.trim();
            if(!code) return alert("أدخل كود الغرفة أولاً!");
            isOffline = false;
            document.getElementById('mode-box').classList.add('hidden');
            connectMQTT(code);
        }

        function renderBoard() {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const items = DATABASE[selectedCategory];

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;
                card.innerHTML = `<img src="${item.img}" alt="${item.name}"><span>${item.name}</span>`;
                card.onclick = () => handleCardClick(index, item.name);
                grid.appendChild(card);
            });
        }

        function handleCardClick(index, name) {
            const card = document.getElementById(`card-${index}`);
            if (!mySecretPlayer) {
                mySecretPlayer = name;
                card.classList.add('my-choice');
                document.getElementById('status').innerText = `كارتك السرّي: (${name}). اسأل أو اضغط على كارت لشطبه!`;
            } else {
                if (confirm(`هل تريد استبعاد/شطب (${name})؟`)) {
                    card.classList.add('eliminated');
                } else if (confirm(`هل تريد تخمين أن كارت المنافس هو (${name})؟`)) {
                    if (isOffline) {
                        if (name === botSecretPlayer) {
                            alert("🎉 مبروك! خمنت كارت الكمبيوتر صح وفزت باللعبة!");
                            addMessage("النظام", `🎉 فزت بالمباراة! الكارت كان (${name})`);
                        } else {
                            addMessage("الكمبيوتر", `تخمين خاطئ ❌ (${name}) مش كارتي السرّي!`);
                        }
                    } else {
                        sendMessage({ type: 'guess', name: name });
                        addMessage("أنت", `خمنت أن كارت صاحبك هو: ${name}`);
                    }
                }
            }
        }

        function sendQuestion() {
            const q = document.getElementById('questionInput').value.trim();
            if(!q) return;
            addMessage("أنت", q);

            if (isOffline) {
                setTimeout(() => {
                    addMessage("الكمبيوتر", "ركز في المواصفات واشطب الكروت المرفوضة! 🤔");
                }, 800);
            } else {
                sendMessage({ type: 'chat', text: q });
            }
            document.getElementById('questionInput').value = "";
        }

        function sendAnswer(ans) {
            addMessage("إجابتك", ans);
            if (!isOffline) sendMessage({ type: 'chat', text: "الإجابة: " + ans });
        }

        function sendMessage(obj) {
            if (client && currentRoom) {
                obj.sender = myClientId;
                client.publish(currentRoom, JSON.stringify(obj));
            }
        }

        function addMessage(sender, text) {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<div class="msg"><b>${sender}:</b> ${text}</div>`;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }
    </script>

</html>
