<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقف في صفي - لعبة الفئات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .category-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
        }

        .cat-btn {
            background: #1c2541;
            color: #38bdf8;
            border: 1px solid #3a506b;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #38bdf8;
            color: #0b132b;
            font-weight: bold;
        }

        .status-bar {
            background: #1c2541;
            width: 100%;
            max-width: 600px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            color: #f59e0b;
            margin-bottom: 15px;
            border: 1px solid #3a506b;
        }

        /* شبكة الكروت */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .card {
            background: #1c2541;
            border: 2px solid #3a506b;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .card .icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .card span {
            font-size: 12px;
            font-weight: bold;
        }

        /* الكروت المستبعدة والمكشوفة */
        .card.eliminated {
            background: #450a0a;
            border-color: #ef4444;
            opacity: 0.35;
            filter: grayscale(100%);
        }

        .card.correct {
            background: #065f46;
            border-color: #10b981;
            animation: pulse 1s infinite;
        }

        /* قسم الأسئلة */
        .questions-section {
            background: #1c2541;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #3a506b;
        }

        .questions-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .questions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .q-btn {
            background: #3a506b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .q-btn:hover {
            background: #2563eb;
        }

        .q-btn:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
        }

        .action-btn {
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎮 اقف في صفي - الفئات</h1>

    <!-- اختيار الفئة -->
    <div class="category-select">
        <button class="cat-btn active" onclick="changeCategory('players')">⚽ لاعيب كرة</button>
        <button class="cat-btn" onclick="changeCategory('actors')">🎬 مشاهير وممثلين</button>
        <button class="cat-btn" onclick="changeCategory('movies')">🍿 أفلام</button>
        <button class="cat-btn" onclick="changeCategory('jobs')">💼 وظائف</button>
        <button class="cat-btn" onclick="changeCategory('food')">🍔 أكل</button>
        <button class="cat-btn" onclick="changeCategory('animals')">🦁 حيوانات</button>
    </div>

    <div id="status" class="status-bar">اختر سؤالاً لاستبعاد الخيارات، أو اضغط مباشرة على الكارت للتخمين!</div>

    <!-- شبكة العناصر -->
    <div id="grid" class="grid-container"></div>

    <!-- قائمة الأسئلة -->
    <div class="questions-section">
        <div class="questions-title">اسأل الكمبيوتر استفساراً للاستبعاد:</div>
        <div id="questions" class="questions-list"></div>
    </div>

    <button class="action-btn" onclick="initGame()">جولة جديدة 🔄</button>

    <script>
        // قاعدة البيانات الشاملة للفئات والخواص
        const DATABASE = {
            players: {
                items: [
                    { name: "محمد صلاح", icon: "🇪🇬", attributes: { isRetired: false, isEgyptian: true, playEurope: true } },
                    { name: "أبو تريكة", icon: "👑", attributes: { isRetired: true, isEgyptian: true, playEurope: false } },
                    { name: "ميسي", icon: "🇦🇷", attributes: { isRetired: false, isEgyptian: false, playEurope: false } },
                    { name: "رونالدو", icon: "🇵🇹", attributes: { isRetired: false, isEgyptian: false, playEurope: false } },
                    { name: "زيدان", icon: "🇫🇷", attributes: { isRetired: true, isEgyptian: false, playEurope: true } },
                    { name: "مرموش", icon: "🦅", attributes: { isRetired: false, isEgyptian: true, playEurope: true } }
                ],
                questions: [
                    { label: "هل معتزل؟", key: "isRetired" },
                    { label: "هل مصري؟", key: "isEgyptian" },
                    { label: "هل بيلعب في أوروبا حالياً؟", key: "playEurope" }
                ]
            },
            actors: {
                items: [
                    { name: "عادل إمام", icon: "🕶️", attributes: { isEgyptian: true, isClassic: true } },
                    { name: "أحمد حلمي", icon: "👓", attributes: { isEgyptian: true, isClassic: false } },
                    { name: "توم كروز", icon: "🎬", attributes: { isEgyptian: false, isClassic: true } },
                    { name: "ويل سميث", icon: "🎭", attributes: { isEgyptian: false, isClassic: false } }
                ],
                questions: [
                    { label: "هل الممثل مصري؟", key: "isEgyptian" },
                    { label: "هل من الجيل القديم/كلاسيكي؟", key: "isClassic" }
                ]
            },
            movies: {
                items: [
                    { name: "الجزيرة", icon: "🏝️", attributes: { isArabic: true, isAction: true } },
                    { name: "إبراهيم الأبيض", icon: "🔪", attributes: { isArabic: true, isAction: true } },
                    { name: "Avatar", icon: "🌌", attributes: { isArabic: false, isAction: true } },
                    { name: "Titanic", icon: "🚢", attributes: { isArabic: false, isAction: false } }
                ],
                questions: [
                    { label: "هل الفيلم عربي؟", key: "isArabic" },
                    { label: "هل الفيلم أكشن؟", key: "isAction" }
                ]
            },
            jobs: {
                items: [
                    { name: "طبيب", icon: "🩺", attributes: { needDegree: true, outdoor: false } },
                    { name: "مهندس", icon: "🏗️", attributes: { needDegree: true, outdoor: true } },
                    { name: "طيار", icon: "✈️", attributes: { needDegree: true, outdoor: true } },
                    { name: "طباخ", icon: "👨‍🍳", attributes: { needDegree: false, outdoor: false } }
                ],
                questions: [
                    { label: "هل تحتاج شهادة جامعية عالية؟", key: "needDegree" },
                    { label: "هل العمل ميداني/خارجي؟", key: "outdoor" }
                ]
            },
            food: {
                items: [
                    { name: "كشري", icon: "🍲", attributes: { isSalty: true, isEgyptian: true } },
                    { name: "بيتزا", icon: "🍕", attributes: { isSalty: true, isEgyptian: false } },
                    { name: "أم علي", icon: "🍨", attributes: { isSalty: false, isEgyptian: true } },
                    { name: "وافل", icon: "🧇", attributes: { isSalty: false, isEgyptian: false } }
                ],
                questions: [
                    { label: "هل أكل حادق؟ (مش حلو)", key: "isSalty" },
                    { label: "هل أكلة أصلها مصري؟", key: "isEgyptian" }
                ]
            },
            animals: {
                items: [
                    { name: "أسد", icon: "🦁", attributes: { isPredator: true, canFly: false } },
                    { name: "صقر", icon: "🦅", attributes: { isPredator: true, canFly: true } },
                    { name: "أرنب", icon: "🐇", attributes: { isPredator: false, canFly: false } },
                    { name: "حمامة", icon: "🕊️", attributes: { isPredator: false, canFly: true } }
                ],
                questions: [
                    { label: "هل مفترس؟", key: "isPredator" },
                    { label: "هل يطير؟", key: "canFly" }
                ]
            }
        };

        let currentCategory = 'players';
        let secretItem = null;
        let gameOver = false;

        function changeCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            initGame();
        }

        function initGame() {
            gameOver = false;
            const categoryData = DATABASE[currentCategory];
            
            // اختيار سرّي
            const randomIndex = Math.floor(Math.random() * categoryData.items.length);
            secretItem = categoryData.items[randomIndex];

            document.getElementById('status').innerText = "تم اختياره سرّاً! استخدم الأسئلة لاستبعاد الكروت أو اضغط على كارت لتخمينه.";

            // رسم الكروت
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            categoryData.items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;
                card.onclick = () => guessDirectly(index);
                card.innerHTML = `
                    <div class="icon">${item.icon}</div>
                    <span>${item.name}</span>
                `;
                grid.appendChild(card);
            });

            // رسم الأسئلة
            const qList = document.getElementById('questions');
            qList.innerHTML = "";
            categoryData.questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'q-btn';
                btn.innerText = q.label;
                btn.onclick = (e) => askQuestion(q.key, q.label, e.target);
                qList.appendChild(btn);
            });
        }

        function askQuestion(attrKey, labelText, btnElement) {
            if (gameOver) return;

            btnElement.disabled = true;
            const hasAttribute = secretItem.attributes[attrKey];

            if (hasAttribute) {
                document.getElementById('status').innerText = `💡 إجابة الكمبيوتر: نعم! (${labelText}) ✅`;
            } else {
                document.getElementById('status').innerText = `❌ إجابة الكمبيوتر: لا! (${labelText})`;
            }

            // استبعاد العناصر غير المتطابقة
            const categoryItems = DATABASE[currentCategory].items;
            categoryItems.forEach((item, index) => {
                if (item.attributes[attrKey] !== hasAttribute) {
                    document.getElementById(`card-${index}`).classList.add('eliminated');
                }
            });
        }

        function guessDirectly(index) {
            if (gameOver) return;

            const selectedItem = DATABASE[currentCategory].items[index];
            const card = document.getElementById(`card-${index}`);

            if (selectedItem.name === secretItem.name) {
                card.classList.add('correct');
                document.getElementById('status').innerText = `🎉 ممتاز يا عبدو! إجابة صحيحة، هو (${secretItem.name})!`;
                gameOver = true;
            } else {
                card.classList.add('eliminated');
                document.getElementById('status').innerText = `❌ ليس (${selectedItem.name})! حاول مجدداً.`;
            }
        }

        // بدء اللعبة لأول مرة
        initGame();
    </script>
</body>
</html>
