<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقف في صفي - أونلاين</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent-blue: #00b4d8;
            --accent-red: #e63946;
            --accent-green: #2a9d8f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #14213d;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        h1 { font-size: 1.2rem; color: #fff; }

        .room-code {
            background: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }

        .active { display: flex; }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-danger { background: var(--accent-red); }
        .btn-green { background: var(--accent-green); }
        .btn:active { transform: scale(0.97); }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            aspect-ratio: 3/4;
            border: 2px solid #334155;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 75%;
            object-fit: cover;
            border-radius: 8px;
        }

        .card span {
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            margin-top: 4px;
        }

        .card.eliminated {
            filter: grayscale(100%);
            opacity: 0.3;
        }

        .card.eliminated::after {
            content: "✕";
            position: absolute;
            color: var(--accent-red);
            font-size: 3.5rem;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .my-choice {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
            border: 1px solid var(--accent-blue);
            font-size: 1rem;
        }

        .connection-status {
            background: #1e293b;
            color: #fbbf24;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            border: 1px solid #fbbf24;
        }
        
        .connection-status.connected {
            color: #34d399;
            border-color: #34d399;
        }

        /* Modal / Pop-up Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--accent-blue);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal h3 { margin-bottom: 15px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>اقف في صفي - أونلاين</h1>
        <div id="roomDisplay" class="room-code" style="display:none;">كود: <span id="codeText"></span></div>
    </header>

    <!-- شاشة البداية -->
    <div id="startScreen" class="screen active">
        <input type="text" id="username" placeholder="اكتب اسمك هنا">
        <button class="btn btn-green" onclick="createRoom()">إنشاء غرفة جديدة</button>
        <hr style="width:100%; border:1px solid #334155; margin:15px 0;">
        <input type="text" id="joinCode" placeholder="أدخل كود الغرفة للإنضمام">
        <button class="btn" style="background:#4338ca;" onclick="joinRoom()">دخول الغرفة</button>
    </div>

    <!-- شاشة اختيار القسم -->
    <div id="categoryScreen" class="screen">
        <h3 style="margin-bottom: 10px;">اختر القسم للعب:</h3>
        <button class="btn" onclick="selectCategory('players')">لاعبين كرة قدم ⚽</button>
        <button class="btn" onclick="selectCategory('actors')">ممثلين 🎬</button>
        <button class="btn" onclick="selectCategory('movies')">أفلام 🎥</button>
        <button class="btn" onclick="selectCategory('food')">أكلات 🍔</button>
    </div>

    <!-- شاشة اختيار الشخصية السرية -->
    <div id="selectTargetScreen" class="screen">
        <h3 style="margin-bottom: 10px; color: var(--accent-blue);">اضغط على كارت لتختاره كـ (شخصيتك السرية):</h3>
        <div class="grid" id="selectionGrid"></div>
    </div>

    <!-- شاشة اللعب -->
    <div id="gameScreen" class="screen">
        <div id="peerStatus" class="connection-status">⏳ في انتظار انضمام الخصم...</div>
        <div class="my-choice">
            شخصيتك السرية: <b id="myTargetName" style="color:var(--accent-blue);">...</b>
        </div>
        <div class="grid" id="grid"></div>
        <button class="btn btn-danger" onclick="leaveGame()">خروج</button>
    </div>

    <!-- نافذة الإجراءات عند الضغط على كارت -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">ماذا تريد أن تفعل؟</h3>
            <button class="btn btn-green" onclick="confirmAction('guess')">🎯 تخمين (هذا هو الاختيار الصح)</button>
            <button class="btn" onclick="confirmAction('eliminate')">❌ استبعاد الكارت</button>
            <button class="btn btn-danger" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        // تم تعديل المسارات لتعمل مع الملفات المرفوعة مباشرة بدون مجلد images
        const DATABASE = {
            players: [
                { name: "محمد صلاح", img: "Salah.jpg" },
                { name: "أبو تريكة", img: "Abu Trika.jpeg" },
                { name: "ليونيل ميسي", img: "Messi.jpeg" },
                { name: "كريستيانو رونالدو", img: "Ronaldo.webp" },
                { name: "عمر مرموش", img: "Marmoush.webp" },
                { name: "محمد الشناوي", img: "Shenawi.webp" },
                { name: "كيليان إمبابي", img: "Mbappe.webp" },
                { name: "إرلينج هالاند", img: "Haaland.webp" },
                { name: "زين الدين زيدان", img: "Zidane.webp" },
                { name: "لوكا مودريتش", img: "Modric.webp" },
                { name: "كريم بنزيما", img: "Benzema.webp" },
                { name: "نيمار داسيلفا", img: "Neymar.webp" },
                { name: "مصطفى محمد", img: "Mustafa.webp" },
                { name: "رونالدينيو", img: "Ronaldinho.webp" },
                { name: "شيكابالا", img: "Chica.webp" }
            ],
            actors: [],
            movies: [],
            food: []
        };

        let peer = null;
        let conn = null;
        let selectedCategory = 'players';
        let myTarget = null;
        let activeCardElement = null;
        let activeCardData = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function createRoom() {
            const randomCode = "ABDO-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(randomCode);

            peer.on('open', (id) => {
                document.getElementById('codeText').innerText = id;
                document.getElementById('roomDisplay').style.display = 'block';
                showScreen('categoryScreen');
            });

            peer.on('connection', (c) => {
                conn = c;
                updateConnectionStatus(true);
            });
        }

        function joinRoom() {
            const code = document.getElementById('joinCode').value.trim();
            if (!code) return alert("من فضلك أدخل كود الغرفة");

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                conn.on('open', () => {
                    updateConnectionStatus(true);
                });
                showScreen('categoryScreen');
            });
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            const list = DATABASE[cat];
            
            if (!list || list.length === 0) {
                alert("هذه الفئة غير متوفرة حالياً، اختر فئة اللاعبين!");
                return;
            }

            // فتح شاشة اختار شخصيتك السرية بنفسك
            const selGrid = document.getElementById('selectionGrid');
            selGrid.innerHTML = '';

            list.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.img}" alt="${item.name}"><span>${item.name}</span>`;
                card.onclick = () => chooseMyTarget(item);
                selGrid.appendChild(card);
            });

            showScreen('selectTargetScreen');
        }

        function chooseMyTarget(item) {
            myTarget = item;
            document.getElementById('myTargetName').innerText = myTarget.name;
            startGame();
        }

        function updateConnectionStatus(isConnected) {
            const statusDiv = document.getElementById('peerStatus');
            if (isConnected) {
                statusDiv.innerText = "🟢 الخصم متصل الآن!";
                statusDiv.classList.add('connected');
            } else {
                statusDiv.innerText = "⏳ في انتظار انضمام الخصم...";
                statusDiv.classList.remove('connected');
            }
        }

        function startGame() {
            const list = DATABASE[selectedCategory];
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            list.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.img}" alt="${item.name}"><span>${item.name}</span>`;
                card.onclick = () => openCardActions(card, item);
                grid.appendChild(card);
            });

            showScreen('gameScreen');
        }

        function openCardActions(cardEl, cardData) {
            activeCardElement = cardEl;
            activeCardData = cardData;
            document.getElementById('modalTitle').innerText = `اختيار: ${cardData.name}`;
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
        }

        function confirmAction(type) {
            closeModal();
            if (type === 'eliminate') {
                activeCardElement.classList.toggle('eliminated');
            } else if (type === 'guess') {
                alert(`🎯 قمت بتخمين: ${activeCardData.name}!`);
            }
        }

        function leaveGame() {
            if (peer) peer.destroy();
            location.reload();
        }
    </script>
</body>
</html>
